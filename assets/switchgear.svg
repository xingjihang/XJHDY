<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="GGD low voltage switchgear assembly with withdrawable circuit breakers">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe8f1"/><stop offset=".5" stop-color="#eef4f9"/><stop offset="1" stop-color="#ccdae7"/>
    </linearGradient>
    <linearGradient id="sgw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20405c"/><stop offset="1" stop-color="#122a40"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="310" rx="152" ry="12" fill="#b9c9d8" opacity=".5"/>
  <!-- plinth -->
  <rect x="42" y="288" width="316" height="14" fill="#6f8499" stroke="#4a5e73" stroke-width="1.4"/>

  <!-- three cubicles -->
  <g stroke="#54697e" stroke-width="2">
    <rect x="50" y="56" width="100" height="232" fill="url(#sg)"/>
    <rect x="152" y="56" width="100" height="232" fill="url(#sg)"/>
    <rect x="254" y="56" width="100" height="232" fill="url(#sg)"/>
  </g>
  <!-- top rail -->
  <rect x="44" y="46" width="316" height="12" rx="2" fill="#b6c7d6" stroke="#54697e" stroke-width="1.6"/>

  <!-- cubicle 1: main incomer -->
  <rect x="60" y="68" width="80" height="34" rx="1.5" fill="url(#sgw)"/>
  <text x="100" y="82" font-family="monospace" font-size="10" fill="#4ee6a8" text-anchor="middle">630 A</text>
  <text x="100" y="95" font-family="monospace" font-size="7" fill="#6d9c8a" text-anchor="middle" letter-spacing="1">INCOMER</text>
  <!-- breaker handle -->
  <g>
    <rect x="76" y="120" width="48" height="60" rx="3" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.4"/>
    <rect x="92" y="130" width="16" height="34" rx="6" fill="#e07b16" stroke="#a4570c" stroke-width="1.2"/>
    <circle cx="100" cy="167" r="5" fill="#3fbf7f" stroke="#2b8a5c" stroke-width="1"/>
  </g>
  <g fill="#7b8fa2" font-family="sans-serif" font-size="6.5" text-anchor="middle">
    <text x="100" y="196">ON</text><text x="100" y="206">OFF</text>
  </g>
  <!-- louvers -->
  <g stroke="#a8bccc" stroke-width="2.2" stroke-linecap="round">
    <line x1="66" y1="222" x2="134" y2="222"/><line x1="66" y1="230" x2="134" y2="230"/>
    <line x1="66" y1="238" x2="134" y2="238"/><line x1="66" y1="246" x2="134" y2="246"/>
    <line x1="66" y1="254" x2="134" y2="254"/><line x1="66" y1="262" x2="134" y2="262"/>
  </g>

  <!-- cubicle 2: metering -->
  <rect x="162" y="68" width="80" height="52" rx="1.5" fill="#f7fafc" stroke="#8ba0b3" stroke-width="1.2"/>
  <g>
    <circle cx="180" cy="86" r="11" fill="#fbfdfe" stroke="#5d768c" stroke-width="1.4"/>
    <circle cx="202" cy="86" r="11" fill="#fbfdfe" stroke="#5d768c" stroke-width="1.4"/>
    <circle cx="224" cy="86" r="11" fill="#fbfdfe" stroke="#5d768c" stroke-width="1.4"/>
    <line x1="180" y1="86" x2="185" y2="79" stroke="#e07b16" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="202" y1="86" x2="207" y2="78" stroke="#e07b16" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="224" y1="86" x2="229" y2="80" stroke="#e07b16" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g fill="#7b8fa2" font-family="sans-serif" font-size="5.5" text-anchor="middle">
    <text x="180" y="106">L1</text><text x="202" y="106">L2</text><text x="224" y="106">L3</text>
  </g>
  <!-- indicator row -->
  <g>
    <circle cx="172" cy="136" r="4" fill="#3fbf7f"/><circle cx="190" cy="136" r="4" fill="#3fbf7f"/>
    <circle cx="208" cy="136" r="4" fill="#e07b16"/><circle cx="226" cy="136" r="4" fill="#c3d0db"/>
  </g>
  <!-- breaker handle 2 -->
  <rect x="178" y="154" width="48" height="52" rx="3" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.4"/>
  <rect x="194" y="162" width="16" height="30" rx="6" fill="#e07b16" stroke="#a4570c" stroke-width="1.2"/>
  <!-- louvers -->
  <g stroke="#a8bccc" stroke-width="2.2" stroke-linecap="round">
    <line x1="168" y1="222" x2="236" y2="222"/><line x1="168" y1="230" x2="236" y2="230"/>
    <line x1="168" y1="238" x2="236" y2="238"/><line x1="168" y1="246" x2="236" y2="246"/>
    <line x1="168" y1="254" x2="236" y2="254"/><line x1="168" y1="262" x2="236" y2="262"/>
  </g>

  <!-- cubicle 3: feeders -->
  <rect x="264" y="68" width="80" height="34" rx="1.5" fill="url(#sgw)"/>
  <text x="304" y="82" font-family="monospace" font-size="10" fill="#4ee6a8" text-anchor="middle">4 × 160 A</text>
  <text x="304" y="95" font-family="monospace" font-size="7" fill="#6d9c8a" text-anchor="middle" letter-spacing="1">FEEDERS</text>
  <g>
    <rect x="272" y="116" width="26" height="44" rx="2.5" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.2"/>
    <rect x="303" y="116" width="26" height="44" rx="2.5" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.2"/>
    <rect x="277" y="122" width="6" height="22" rx="3" fill="#e07b16"/>
    <rect x="308" y="122" width="6" height="22" rx="3" fill="#e07b16"/>
  </g>
  <g>
    <rect x="272" y="168" width="26" height="44" rx="2.5" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.2"/>
    <rect x="303" y="168" width="26" height="44" rx="2.5" fill="#e8eff6" stroke="#8ba0b3" stroke-width="1.2"/>
    <rect x="277" y="174" width="6" height="22" rx="3" fill="#e07b16"/>
    <rect x="308" y="174" width="6" height="22" rx="3" fill="#e07b16"/>
  </g>
  <g stroke="#a8bccc" stroke-width="2.2" stroke-linecap="round">
    <line x1="270" y1="230" x2="338" y2="230"/><line x1="270" y1="238" x2="338" y2="238"/>
    <line x1="270" y1="246" x2="338" y2="246"/><line x1="270" y1="254" x2="338" y2="254"/>
    <line x1="270" y1="262" x2="338" y2="262"/>
  </g>

  <!-- door locks -->
  <g fill="#5d768c"><circle cx="144" cy="176" r="3"/><circle cx="246" cy="176" r="3"/><circle cx="348" cy="176" r="3"/></g>
</svg>
