<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Three phase cast resin dry type transformer with copper windings">
  <defs>
    <linearGradient id="coil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3702a"/><stop offset=".28" stop-color="#e8a961"/>
      <stop offset=".62" stop-color="#c9822f"/><stop offset="1" stop-color="#94581c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa1b3"/><stop offset="1" stop-color="#5e7288"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="312" rx="140" ry="12" fill="#b9c9d8" opacity=".5"/>

  <!-- base channel -->
  <rect x="62" y="286" width="276" height="16" rx="2" fill="#7f93a7" stroke="#54697e" stroke-width="1.6"/>
  <rect x="78" y="302" width="24" height="8" rx="1" fill="#54697e"/>
  <rect x="298" y="302" width="24" height="8" rx="1" fill="#54697e"/>

  <!-- top and bottom yoke -->
  <rect x="70" y="78" width="260" height="26" rx="2" fill="url(#core)" stroke="#4a5e73" stroke-width="1.6"/>
  <rect x="70" y="240" width="260" height="24" rx="2" fill="url(#core)" stroke="#4a5e73" stroke-width="1.6"/>
  <!-- laminated core lines -->
  <g stroke="#4a5e73" stroke-width=".9" opacity=".55">
    <line x1="70" y1="86" x2="330" y2="86"/><line x1="70" y1="94" x2="330" y2="94"/>
    <line x1="70" y1="248" x2="330" y2="248"/><line x1="70" y1="255" x2="330" y2="255"/>
  </g>

  <!-- three limbs with windings -->
  <g>
    <!-- limb 1 -->
    <rect x="84" y="104" width="22" height="136" fill="url(#core)" stroke="#4a5e73" stroke-width="1.4"/>
    <rect x="92" y="112" width="60" height="120" rx="4" fill="url(#coil)" stroke="#7d4a14" stroke-width="1.4"/>
    <ellipse cx="122" cy="112" rx="30" ry="8" fill="#eda964" stroke="#7d4a14" stroke-width="1.4"/>
    <g stroke="#7d4a14" stroke-width="1" opacity=".45">
      <line x1="92" y1="132" x2="152" y2="132"/><line x1="92" y1="152" x2="152" y2="152"/>
      <line x1="92" y1="172" x2="152" y2="172"/><line x1="92" y1="192" x2="152" y2="192"/>
      <line x1="92" y1="212" x2="152" y2="212"/>
    </g>

    <!-- limb 2 -->
    <rect x="189" y="104" width="22" height="136" fill="url(#core)" stroke="#4a5e73" stroke-width="1.4"/>
    <rect x="197" y="112" width="60" height="120" rx="4" fill="url(#coil)" stroke="#7d4a14" stroke-width="1.4"/>
    <ellipse cx="227" cy="112" rx="30" ry="8" fill="#eda964" stroke="#7d4a14" stroke-width="1.4"/>
    <g stroke="#7d4a14" stroke-width="1" opacity=".45">
      <line x1="197" y1="132" x2="257" y2="132"/><line x1="197" y1="152" x2="257" y2="152"/>
      <line x1="197" y1="172" x2="257" y2="172"/><line x1="197" y1="192" x2="257" y2="192"/>
      <line x1="197" y1="212" x2="257" y2="212"/>
    </g>

    <!-- limb 3 -->
    <rect x="294" y="104" width="22" height="136" fill="url(#core)" stroke="#4a5e73" stroke-width="1.4"/>
    <rect x="302" y="112" width="60" height="120" rx="4" fill="url(#coil)" stroke="#7d4a14" stroke-width="1.4"/>
    <ellipse cx="332" cy="112" rx="30" ry="8" fill="#eda964" stroke="#7d4a14" stroke-width="1.4"/>
    <g stroke="#7d4a14" stroke-width="1" opacity=".45">
      <line x1="302" y1="132" x2="362" y2="132"/><line x1="302" y1="152" x2="362" y2="152"/>
      <line x1="302" y1="172" x2="362" y2="172"/><line x1="302" y1="192" x2="362" y2="192"/>
      <line x1="302" y1="212" x2="362" y2="212"/>
    </g>
  </g>

  <!-- terminal bushings on top -->
  <g>
    <rect x="96" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="118" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="140" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="201" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="223" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="245" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="306" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="328" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
    <rect x="350" y="58" width="8" height="22" rx="2" fill="#6f8499" stroke="#4a5e73" stroke-width="1.2"/>
  </g>
  <!-- busbar -->
  <rect x="86" y="44" width="282" height="9" rx="2" fill="#e07b16" stroke="#a4570c" stroke-width="1.2"/>

  <!-- warning label -->
  <rect x="176" y="248" width="48" height="12" rx="1.5" fill="#f3d9b4" stroke="#b8843c" stroke-width="1"/>
  <text x="200" y="257" font-family="sans-serif" font-size="6.5" fill="#8a5c1c" text-anchor="middle" letter-spacing=".6">SCB13 · 1000kVA</text>
</svg>
